# The page in a real browser (Chromium at 1440x900, 1280x800 and a 390x844 phone): one screen, no
# horizontal scroll, hero loads, links, alt text, lightboxes — plus screenshots. On demand ONLY,
# never on a schedule (owner decision, 2 Oct 2026), never per merge.
#
# Build first, test in batches. The merge gate is `validate.yml` (static checks, the upload e2e,
# guards). This runs only when dispatched: by a person (`gh workflow run e2e.yml --ref main`) or by
# `land` after a large change (the `large` block of `land` in seq23/seq-bin defines "large"); on
# success `deploy.yml` publishes exactly this sha to justbeingmercedes.com. A SMALL change ships
# on the fast check without this run (owner decision 2 Oct 2026; `land <pr>` dispatches
# `deploy.yml` with its verdict, `scripts/production-gate.mjs` checks it). A red run here leaves
# production where it is, BLOCKS every small change until a green run is newer (known red), and
# is fixed first. `timeout-minutes` is a fault detector (~4x normal), never a budget.
#
# NOT `push`, NOT `pull_request`, NOT `schedule`: scripts/validate-workflows.mjs fails the merge
# gate if any of them comes back.
name: e2e
on:
  workflow_dispatch:
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e2e:
    runs-on: ubuntu-latest
    # Normal: ~1 min including the Chromium install. 10 is a fault detector, never a budget.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: The page in Chromium, three viewports, with screenshots
        run: npm run screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/
          retention-days: 14
