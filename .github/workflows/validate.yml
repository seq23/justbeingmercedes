# The MERGE GATE: the static half of the validator (image cap, email_off, Functions wiring,
# rendering helpers), the upload backend e2e against `wrangler pages dev`, and the workflow guard —
# about a minute, no browser. It is the run ~/bin/land watches on `main`.
#
# Build first, test in batches (26 Sep 2026): the page-in-Chromium checks (`npm run screenshots`)
# are NOT here. They run nightly and on dispatch in `e2e.yml` and gate PRODUCTION, not the merge:
# `deploy.yml` publishes every push to `main` as the staging preview
# (https://staging.justbeingmercedes.pages.dev) and publishes justbeingmercedes.com only from a sha
# `e2e` has passed. `scripts/validate-workflows.mjs` fails this run if the browser step comes back.
name: Validate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    # Normal: ~1 min (the last five runs took 55 s to 1m21s WITH the browser). 5 is a fault detector.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Static checks (no browser)
        run: npm run validate:static
      - name: The browser checks are nightly, never per merge; production only from an e2e-green sha
        run: npm run validate:workflows
      - name: Upload backend end-to-end (wrangler pages dev + local R2)
        run: npm test
